<!DOCTYPE html>
<html>
    <head>
        <title>Eaglercraftss</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/marble892/eaglercraft-jsdelivr@latest/style.css" />
    </head>
    <body>
        <h1>Eaglercrafts:</h1>
        <hr/>
        <ul id="clients"></ul>
        <script type="module">
            const entries = (await (await fetch("https://cdn.jsdelivr.net/gh/marble892/eaglercraft-jsdelivr@latest/config.json")).json())["versions"].reduce((acc,entry)=>{acc[entry.name]=entry.hashname;return acc},{});
            const clients = document.getElementById("clients");
            for (const [name, hashname] of Object.entries(entries)) {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = `https://cdn.jsdelivr.net/gh/marble892/eaglercraft-jsdelivr@latest/index.svg#${hashname}`;
                a.textContent = name;
                li.appendChild(a);
                clients.appendChild(li);
            }
        </script>
    </body>
</html>
