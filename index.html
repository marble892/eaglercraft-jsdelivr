<!DOCTYPE html>
<html>
    <head>
        <title>Eaglercraftss</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/marble892/eaglercraft-jsdelivr@main/style.css" />
    </head>
    <body>
        <h1>Eaglercrafts:</h1>
        <hr/>
        <ul id="clients"></ul>
        <script>
            const entries = {"1.21.11 WASM (BETA)":"1-21-11WASM","1.21.11 (BETA)":"1-21-11","1.12.2u3":"1-12-2u3","1.12.2u3 WASM":"1-12-2u3WASM","1.8.8u53":"1-8-8u53","1.8.8u53 WASM":"1-8-8u53WASM"}
            const clients = document.getElementById("clients");
            for (const [name, hashname] of Object.entries(entries)) {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = `https://cdn.jsdelivr.net/gh/marble892/eaglercraft-jsdelivr@main/index.svg#${hashname}`;
                a.textContent = name;
                li.appendChild(a);
                clients.appendChild(li);
            }
        </script>
    </body>
</html>
